replicaCount: 2
revisionHistoryLimit: 3
commonLabels: {}
commonAnnotations: {}
podLabels: {}
podAnnotations: {}
image:
  repository: ghcr.io/saimudunuri04/incident-triage-agent
  tag: "637e23b0df343f0f0464028359cfac6162fd635a"
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
service:
  type: ClusterIP
  port: 8000
  annotations: {}
containerPort: 8000
rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0
termination:
  gracePeriodSeconds: 45
  preStopSleepSeconds: 5
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
probes:
  startup:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    httpGet:
      path: /health/ready
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
  liveness:
    httpGet:
      path: /health/live
      port: http
    periodSeconds: 20
    timeoutSeconds: 5
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
pdb:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: false
  ingressFrom:
    - podSelector: {}
  egressTo: []
env: {}
envFromSecretName: ""
# Non-secret runtime configuration delivered as env vars via a ConfigMap.
# Paths must match the volumes mounted into the pod (see `volumes`/`volumeMounts`).
# Secrets (LLM_API_KEY) stay out of here; wire them via `envFromSecretName`.
config:
  enabled: true
  data:
    RUNBOOK_ROOT: "/data/runbooks"
    METRICS_PATH: "/data/metrics.json"
volumeMounts: []
volumes: []
