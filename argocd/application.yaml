apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incident-triage-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SaiMudunuri04/incident-triage-agent.git
    targetRevision: main
    path: helm/chart
  destination:
    server: https://kubernetes.default.svc
    namespace: incident-triage-agent
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
